name: bclibc_flutter
description: "Deprecated compatibility shim: re-exports bclibc, which now includes native, wasm and Flutter support. Depend on bclibc directly."
version: 2.0.0-alpha.1
repository: https://github.com/ballistics-lab/dart-bclibc

environment:
  sdk: ^3.11.4

dependencies:
  bclibc: ^2.0.0-alpha.1

dependency_overrides:
  bclibc:
    path: ../dart
