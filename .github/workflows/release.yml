name: Release

# Triggered by pushing a tag like v1.2.3 -- that tag must already be sitting
# on a commit where pubspec.yaml's `version:` and CHANGELOG.md are fully
# consistent with it. verify-release below
# only checks that; it never bumps/commits/pushes anything on your behalf,
# unlike this workflow's previous version (which used to bump pubspec.yaml
# and push a commit to main *after* the tag already existed -- a real
# footgun for anything that derives its version from the tag itself via
# `git describe`, and fragile even here since it meant the tag and the
# commit it was "for" could silently disagree).
#
# Run `scripts/ci/prepare_release.py X.Y.Z` locally to prepare all of the
# above as uncommitted edits for you to review, then commit + push to main
# + tag yourself -- see that script's docstring.
on:
  push:
    tags:
      - "v*"

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── verify the tag's commit already has consistent versions/changelog —
  # no writes, no commits. Fails the whole release instead of auto-fixing
  # anything; see scripts/ci/prepare_release.py for the local tool that gets
  # a commit into this state before you tag it ─────────────────────────────
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to look up the CI run of the tagged commit
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      # Checking out the tag itself (not main) is the point: this is the
      # exact commit publish-dart will build from, so
      # whatever's wrong here is exactly what would otherwise break
      # publishing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      # Tests are not repeated for a tag: CI already ran on this exact commit
      # (pull request / push to main). Publishing from a commit CI has not
      # passed on is refused instead -- run ci.yml manually for it first
      # (Actions -> CI -> Run workflow), then re-tag.
      - name: The tagged commit must already have a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="$(git rev-parse HEAD)"
          RUNS="$(gh run list --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)"
          if [ "$RUNS" -eq 0 ]; then
            echo "::error::No successful CI run found for $SHA. Run the CI workflow on this commit (or merge through a PR/main so it runs), then re-tag."
            exit 1
          fi
          echo "CI already passed on $SHA ($RUNS successful run(s))."

      - name: Extract version and detect pre-release
        id: meta
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: pubspec.yaml must already read this tag's version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "pubspec.yaml has version $PUBSPEC_VERSION, expected $VERSION"
            echo "Run scripts/ci/prepare_release.py $VERSION locally, commit, and re-tag."
            exit 1
          fi

      - name: CHANGELOG.md must already have a "## [$VERSION]" heading (not just [Unreleased])
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          V_RE="${VERSION//./\\.}"
          if ! grep -qE "^## \[$V_RE\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$VERSION]' heading -- run scripts/ci/prepare_release.py $VERSION locally, commit, and re-tag."
            exit 1
          fi

  # ── create the GitHub release ────────────────────────────────────────────
  create-release:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: release # requires manual approval in repo Settings → Environments
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.verify-release.outputs.version }}"
          ./scripts/ci/extract-changelog.sh "$VERSION" CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "No changelog entry found for $VERSION (or [Unreleased]) in CHANGELOG.md -- add one first"
            exit 1
          fi

          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${RELEASE_TAG}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_TAG}"
            } >> /tmp/release_notes.md
          fi

          echo "--- release notes ---"
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_notes.md
          prerelease: ${{ needs.verify-release.outputs.prerelease }}

  # ── publish bclibc to pub.dev (bclibc_flutter is no longer released from
  # this repository) ────────────────────────────────────────
  publish-dart:
    needs: [verify-release, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a missing credential must fail, not hang on an interactive prompt
    environment: pub-dart
    permissions:
      id-token: write # pub.dev OIDC trusted publisher
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --no-example
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
