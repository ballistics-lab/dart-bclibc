name: iOS investigation

# Temporary: only the iOS part of ci.yml, to find out why the integration test on
# the simulator sometimes never finishes (it passed in some runs of the same code
# and hung after "Xcode build done" in others). Runs on a push to this branch only,
# so nothing else of CI is started. Two independent jobs (separate VMs) tell a
# flaky test from a bad runner.

on:
  push:
    branches: [ci/ios-investigate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    # Parked: two samples passed (3m40s / 7m45s for the test step). Enable with
    # workflow_dispatch to get more.
    if: github.event_name == 'workflow_dispatch'
    name: iOS #${{ matrix.run }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Environment (compare it between good and bad runs)
        working-directory: .
        run: |
          echo "runner: ${RUNNER_NAME:-?}  image: ${ImageOS:-?} ${ImageVersion:-?}"
          sw_vers; uname -m
          xcodebuild -version
          flutter --version
          xcrun simctl list runtimes
          system_profiler SPHardwareDataType | grep -E "Model|Chip|Memory|Cores" || true
          vm_stat | head -5
          df -h / | tail -1

      - name: Build for a device (unsigned)
        run: |
          set -euo pipefail
          [ -d ios ] || flutter create --platforms=ios --project-name bclibc_example .
          flutter pub get
          flutter build ios --release --no-codesign
          APP="$(find build/ios -type d -name Runner.app | head -1)"
          LIB="$(find "$APP" -type f -name '*bclibc_ffi*' | head -1)"
          echo "library: $LIB"; lipo -archs "$LIB"

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')"
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -E "Booted|$UDID"

      - name: Integration test (verbose, with a heartbeat and a 15 min watchdog)
        env:
          UDID: ${{ steps.sim.outputs.UDID }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/flutter-test.log"; : > "$LOG"
          START=$(date +%s)
          flutter test integration_test -d "$UDID" -v > "$LOG" 2>&1 &
          PID=$!
          tail -n +1 -f "$LOG" &
          TAIL=$!
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30
            E=$(( $(date +%s) - START ))
            echo "::notice::[$E s] test still running; log $(wc -l < "$LOG") lines; last: $(tail -n 1 "$LOG" | cut -c1-160)"
            if [ "$E" -ge 900 ]; then
              echo "::error::WATCHDOG: integration test did not finish in 900 s, collecting diagnostics"
              echo "--- processes"; ps aux | grep -E "flutter|dart|xcodebuild|Simulator|simctl|bclibc" | grep -v grep | cut -c1-200
              echo "--- simulator state"; xcrun simctl list devices | grep -E "Booted|Shutdown" | head
              echo "--- simulator log, last 10 min (errors, bclibc, crashes)"
              xcrun simctl spawn "$UDID" log show --last 10m --style compact 2>&1 \
                | grep -iE "bclibc|dyld|crash|terminat|jetsam|fatal|error" | tail -80
              echo "--- crash reports"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5
              pkill -9 -P "$PID" 2>/dev/null; kill -9 "$PID" 2>/dev/null
              break
            fi
          done
          wait "$PID" 2>/dev/null; CODE=$?
          kill "$TAIL" 2>/dev/null
          echo "flutter test exit code: $CODE  after $(( $(date +%s) - START )) s"
          exit "$CODE"

  # The same check as the macOS/Linux/Windows self-test, without `flutter test`:
  # build the example for the simulator, install it, start it with
  # BCLIBC_EXAMPLE_SELFTEST=1 and read its output. No VM-service handshake between
  # the Flutter tool and the app (the step `flutter test integration_test` can
  # wait on forever), so the only thing under test is: does the library load and
  # compute on iOS.
  selftest:
    # Parked: 3 of 3 samples launched the app but got no output from it in up to
    # 180 s (the app stays alive, the simulator log shows nothing from Runner).
    if: github.event_name == 'workflow_dispatch'
    name: simctl self-test #${{ matrix.run }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Build for the simulator
        run: |
          set -euo pipefail
          [ -d ios ] || flutter create --platforms=ios --project-name bclibc_example .
          flutter pub get
          flutter build ios --simulator --debug
          test -d build/ios/iphonesimulator/Runner.app

      - name: Boot a simulator and install the app
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')"
          APP=build/ios/iphonesimulator/Runner.app
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"; echo "BID=$BID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          find "$APP" -name '*bclibc_ffi*' | head -3

      - name: Run the self-test in the simulator (180 s watchdog, diagnostics)
        env:
          UDID: ${{ steps.sim.outputs.UDID }}
          BID: ${{ steps.sim.outputs.BID }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/selftest.log"; : > "$LOG"
          START=$(date +%s)
          SIMCTL_CHILD_BCLIBC_EXAMPLE_SELFTEST=1 \
            xcrun simctl launch --console --terminate-running-process "$UDID" "$BID" > "$LOG" 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            grep -q "bclibc self-test" "$LOG" && break
            if ! kill -0 "$PID" 2>/dev/null; then echo "simctl launch ended after $(( $(date +%s) - START )) s"; break; fi
            [ $((i % 30)) -eq 0 ] && echo "[$i s] waiting; app running: $(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -c "$BID")"
            sleep 1
          done
          kill "$PID" 2>/dev/null
          echo "--- app output (after $(( $(date +%s) - START )) s)"; cat "$LOG"; echo "--- end"
          if grep -q "^bclibc self-test ok" "$LOG"; then echo "OK: the library loaded and computed on the iOS simulator"; exit 0; fi
          echo "=== diagnostics"
          echo "--- is the app still running?"; xcrun simctl spawn "$UDID" launchctl list 2>&1 | grep -i "ballisticslab\|Runner" | head
          echo "--- simulator log of the app (last 5 min)"
          xcrun simctl spawn "$UDID" log show --last 5m --info --debug --style compact \
            --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "bclibc" OR eventMessage CONTAINS[c] "dyld"' 2>&1 | tail -80 | cut -c1-260
          echo "--- crash reports"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null
          echo "FAILED: no 'bclibc self-test ok' within 180 s"; exit 1

  # Exactly what the iOS job of ci.yml runs (same script, same shell, same working
  # directory): if it hangs here too, the difference to the jobs above is how the
  # test is invoked; if not, the hangs in ci.yml are down to the environment.
  ci-script:
    name: ci.yml iOS step #${{ matrix.run }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Environment
        run: |
          echo "runner: ${RUNNER_NAME:-?}  image: ${ImageOS:-?} ${ImageVersion:-?}"
          sw_vers; xcodebuild -version; flutter --version | head -2

      - name: scripts/ci/flutter-smoke.sh ios
        run: |
          date -u +%T
          time scripts/ci/flutter-smoke.sh ios
          date -u +%T
