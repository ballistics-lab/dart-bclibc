name: CI

on:
  push:
    branches: [main]
    paths: &ci-paths
      - "dart/**"
      - "flutter/**"
      - "Makefile"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *ci-paths
  workflow_call:

# No top-level `concurrency:` here -- this workflow is also invoked as a
# reusable workflow from release.yml (run-tests), and inside that context
# `github.workflow` still refers to the *caller's* name ("Release"), not
# "CI". A concurrency group keyed on `${{ github.workflow }}-${{ github.ref
# }}` would then resolve to the exact same group release.yml's own
# top-level concurrency block already holds for that run, which GitHub
# detects as a self-deadlock and cancels outright ("Canceling since a
# deadlock was detected for concurrency group ... between a top level
# workflow and 'run-tests'"). release.yml's own concurrency block is enough
# to dedupe/cancel superseded release runs; a stale push/pull_request CI
# run for this workflow's own direct triggers just runs to completion
# instead of being cancelled by a newer one, which is a fine trade-off here.
jobs:
  # ── the bclibc pin must agree everywhere: the dart/bclibc submodule, the
  # embedded wasm module and the CHANGELOG. Needs no submodule checkout: tags
  # are resolved via `git ls-remote`, and CI=true makes an unresolvable tag
  # fatal. ────────────────────────────────────────────────────────────────────
  verify-bclibc:
    name: Verify bclibc versions stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: make verify-bclibc

  # ── dart/ — the one real package: native (build hook), web (embedded wasm)
  # and Flutter all use it as is. ───────────────────────────────────────────────
  analyze-dart:
    name: dart/ Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart analyze --fatal-infos

  # The build hook (hook/build.dart) compiles the bundled sources, so a C++
  # compiler is all that's needed -- no separate "build native" step.
  test-dart:
    name: dart/ Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang

      - run: dart pub get
      - run: dart test --exclude-tags=browser test/ffi_test.dart test/hit_result_test.dart test/unit_test.dart test/async_calculator_test.dart

  # The wasm module is embedded in the package (lib/ffi/bclibc_wasm.g.dart):
  # no asset to stage, no native build, no submodule checkout needed.
  test-dart-web:
    name: dart/ Test / web (Chrome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart test -p chrome test/web/

  # `flutter test` in a real Flutter project that depends on bclibc by path:
  # the case the build hook exists for (a bundled-library lookup that works
  # the same under `flutter test` as under `dart run`).
  test-flutter:
    name: Flutter consumer Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: flutter test against bclibc
        run: scripts/ci/flutter-smoke.sh

  publish-dry-run-dart:
    name: dart/ pub.dev dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart pub publish --dry-run

  # ── flutter/ — deprecated shim that only re-exports bclibc ───────────────────
  analyze-flutter:
    name: flutter/ Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart analyze --fatal-infos

  publish-dry-run-flutter:
    name: flutter/ pub.dev dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart pub publish --dry-run
