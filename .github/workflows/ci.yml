name: CI

on:
  push:
    branches: [main]
    # Only what a job actually reads. CHANGELOG.md and pubspec.yaml are the two
    # files a release-prep commit changes, and release.yml refuses to publish
    # a commit CI has not passed on -- so they must trigger CI. Other doc-only
    # commits skip it (start it by hand with workflow_dispatch before tagging).
    paths: &ci-paths
      - "lib/**"
      - "hook/**"
      - "test/**"
      - "bclibc"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "CHANGELOG.md"
      - "Makefile"
      - "scripts/ci/verify-bclibc.sh"
      - "scripts/ci/flutter-smoke.sh"
      - "scripts/ci/missing-library-check.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *ci-paths
  # Manual run, e.g. for a commit the paths filter above skipped but that you want
  # to tag: release.yml requires a successful CI run on the tagged commit.
  workflow_dispatch:

jobs:
  # ── the bclibc pin must agree everywhere: the bclibc submodule, the embedded
  # wasm module and the CHANGELOG. Needs no submodule checkout: tags are
  # resolved via `git ls-remote`, and CI=true makes an unresolvable tag
  # fatal. ────────────────────────────────────────────────────────────────────
  verify-bclibc:
    name: Verify bclibc versions stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: make verify-bclibc

  # ── one package: native (build hook), web (embedded wasm) and Flutter all
  # use it as is. ─────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --no-example
      - run: dart analyze --fatal-infos

  # The build hook (hook/build.dart) compiles the bundled sources, so a C++
  # compiler is all that's needed -- no separate "build native" step.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang

      - run: dart pub get --no-example
      - run: dart test --exclude-tags=browser test/ffi_test.dart test/hit_result_test.dart test/unit_test.dart test/async_calculator_test.dart

      # BcLibC.open() has to throw when the library cannot be loaded (it used to
      # return fine and fail at the first calculation).
      - name: open() fails fast without the library
        run: scripts/ci/missing-library-check.sh

  # The wasm module is embedded in the package (lib/ffi/bclibc_wasm.g.dart):
  # no asset to stage. The submodule is still needed: `dart test` runs the
  # package's build hook even for `-p chrome`, and the hook compiles
  # bclibc/'s sources.
  test-web:
    name: Test / web (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang

      - run: dart pub get --no-example
      - run: dart test -p chrome test/web/

  # example/ (a Flutter app that depends on bclibc by path), built for every
  # target ebalistyka ships (Linux, Windows, Android, web) plus `flutter test`
  # (the case the build hook exists for: a bundled-library lookup that works
  # the same under `flutter test` as under `dart run`). Each build step then
  # checks the library the hook compiled is in the build output.
  # See scripts/ci/flutter-smoke.sh.
  flutter-smoke:
    name: Flutter ${{ matrix.target }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: test, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
          - { target: web, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install system deps
        if: matrix.os == 'ubuntu-latest' && (matrix.target == 'test' || matrix.target == 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: ${{ matrix.target }}
        run: scripts/ci/flutter-smoke.sh ${{ matrix.target }}

  publish-dry-run:
    name: pub.dev dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --no-example
      - run: dart pub publish --dry-run

  # The Android build above only proves the .so is inside the APK. This loads it
  # on an emulator and computes (example/integration_test).
  android-runtime:
    name: Android emulator (the library loads and computes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: cd example && flutter pub get && flutter test integration_test
